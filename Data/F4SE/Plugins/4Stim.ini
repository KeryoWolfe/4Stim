[General]
; Scene hotkey, as a Windows virtual-key code (decimal or 0x hex).
; Out of a scene it opens the scene picker. In a scene, the HUD takes the
; arrow keys / d-pad as soon as it appears; the hotkey hands them back to the
; game and takes them again.
; Letters are their uppercase ASCII codes: A = 0x41 ... Z = 0x5A, so N = 0x4E.
; Digits 0-9 = 0x30-0x39, F1-F12 = 0x70-0x7B.
iHotkey=0x4E

; How the hotkey picks your scene partner:
;   Crosshair - the eligible actor closest to the direction you're facing
;   Proximity - the nearest eligible actor, wherever you're facing
sTargetMode=Crosshair

; Crosshair: how far to look, and how many degrees either side of your
; facing still count.
fMaxDistance=300
fCrosshairCone=10

; Proximity: search radius.
fProximityRadius=200

; Free camera speed during scenes, as a multiplier on the game's own free
; camera speed (0.5 = half). Restored when the scene ends.
fFreeCameraSpeed=0.5

; Scene speed keys (virtual-key codes), while you're in a scene.
; 0xBB = the =/+ key, 0xBD = the -/_ key.
iSpeedUpKey=0xBB
iSpeedDownKey=0xBD

; When a transition moves on to its destination, in seconds before its set
; length (negative = after it). Transition clips play once (dyn_Activation)
; and end with about 0.5 s of held last pose (see docs/SCENES.md), so the
; default 0 moves on as the motion finishes, while the pose is held and
; before the game starts blending the clip back to the base pose. If the
; clip ends first anyway, 4Stim moves on the moment it does.
fTransitionLead=0.0

; 1 = only offer scenes the actors fit: each scene says which sex may take
; each of its roles (male, female or any). A new scene gives each actor the
; role that fits. 0 = offer every scene for that many actors.
bMatchSex=1

; New scenes: the picker lists the NPCs this far around you to add to the
; scene (the one the hotkey found is already in).
fActorRadius=1500

; Furniture: when the picker opens, it looks this far around you (and this
; far up or down) for beds, chairs, tables and so on, and lists the scenes
; that can be played on the nearest of each. Types are defined in
; F4SE\Plugins\4Stim\Furniture\ (see docs/FURNITURE.md).
fFurnitureRadius=500
fFurnitureHeight=100

; 1 = log every object the furniture search looks at (with its model path)
; and where furniture scenes are placed, to 4Stim.log. For writing and
; tuning furniture types.
bLogFurniture=0

; 1 = log every animation event scene actors get in the first 5 s of each
; scene, to 4Stim.log. For animation authors.
bLogAnimEvents=0

[HUD]
; The in-scene HUD. 1 = on, 0 = off (the hotkey then opens the scene's
; navigation in the picker instead).
bEnableHUD=1

; HUD theme: a file name in Data\Interface\4Stim\Themes\, without .json.
; Built in: Color, PipBoy. See HUD_API.md to make your own.
sTheme=Color

[Excitement]
; Every actor in a scene has an excitement from 0 to 100. It rises with what
; the scene's actions give them (docs/ACTIONS.md), faster at higher speeds,
; and only as high as those actions allow (kissing alone stops at 50).
; Above that it falls back. At 100 the actor climaxes. The HUD's actor
; meters show it. 1 = on, 0 = off.
bEnableExcitement=1

; Multipliers on how fast men and women get excited.
fMaleExcitementMult=1.0
fFemaleExcitementMult=1.0

; How fast excitement falls (per second) when the scene gives less than an
; actor has, and how many seconds it waits before it starts falling.
fExcitementDecayRate=0.5
fExcitementDecayGrace=5.0

; After a climax a man starts over at 0. A woman starts at this times the
; number of climaxes she's had in the scene, up to the max.
fPostClimaxExcitement=20
fPostClimaxExcitementMax=60

; 1 = when an actor climaxes in a scene that has a climax animation for
; their role (a "climax" scene, see docs/SCENES.md), play it. Otherwise a
; man's climax drops the scene to its slowest speed.
bClimaxScenes=1

; When a scene with the player in it ends after a climax: when the player
; climaxes, when a man does, when a woman does, or (bEndOnAllClimax=1,
; overriding the other three) only once everyone has.
bEndOnPlayerClimax=0
bEndOnMaleClimax=1
bEndOnFemaleClimax=0
bEndOnAllClimax=0

; 1 = scenes without the player end at their first climax.
bEndNPCScenesOnClimax=1

; Seconds between the climax and the scene ending.
fClimaxEndDelay=4.0
