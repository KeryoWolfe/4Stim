<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4Stim Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Generated by tools/make-roadmap-page.py from docs/TODO.md. Layout: a narrow index rail beside one reading column; stacks on phones. Palette follows 4Stim's HUD green. */
:root {
  --bg: #f3f6f3; --panel: #ffffff; --fg: #16201a; --muted: #5b6b60; --rule: #d5ded7;
  --accent: #0e7a43; --accent-soft: #e1f2e8; --code-bg: #e9efea;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b100d; --panel: #111915; --fg: #d9e7dd; --muted: #8aa093; --rule: #223029;
  --accent: #1aff80; --accent-soft: #123323; --code-bg: #18231d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b100d; --panel: #111915; --fg: #d9e7dd; --muted: #8aa093; --rule: #223029;
  --accent: #1aff80; --accent-soft: #123323; --code-bg: #18231d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); padding: 32px 16px 64px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; gap: 24px; } aside { position: static !important; } }
aside { position: sticky; top: 24px; align-self: start; display: grid; gap: 20px; }
.brand h1 { font: 700 2.1rem/1 var(--display); letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }
.brand p { margin: 6px 0 0; color: var(--muted); font: 400 0.8rem/1.4 var(--mono); }
.meter { display: grid; gap: 6px; }
.meter .label { display: flex; justify-content: space-between; font: 500 0.75rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.meter .track { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.meter .fill { height: 100%; width: {{PCT}}%; background: var(--accent); }
nav { display: grid; gap: 2px; }
nav a { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
nav a:hover, nav a:focus-visible { background: var(--accent-soft); outline: none; }
nav .count { font: 400 0.8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
main { display: grid; gap: 36px; min-width: 0; }
section { display: grid; gap: 10px; min-width: 0; scroll-margin-top: 24px; }
section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--fg); padding-bottom: 6px; }
h2 { font: 700 1.55rem/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
h3 { font: 600 0.8rem var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 18px 0 0; }
.tally { font: 400 0.8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
section p { margin: 0; max-width: 68ch; color: var(--muted); }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; max-width: 72ch; }
.note p { color: var(--fg); }
ul { list-style: none; margin: 0; padding: 0; display: grid; }
li { padding: 12px 0 12px 22px; border-bottom: 1px solid var(--rule); position: relative; max-width: 72ch; }
li p { color: var(--fg); margin: 0 0 6px; }
li ul { margin-top: 6px; }
li li { border: 0; padding: 2px 0 2px 16px; }
li li::before { width: 5px !important; height: 5px !important; top: 0.75em !important; }
li::before { content: ""; position: absolute; left: 2px; top: 1.15em; width: 9px; height: 9px; border: 2px solid var(--muted); border-radius: 2px; }
li.done::before { background: var(--accent); border-color: var(--accent); }
li.done del { text-decoration: none; }
li.done > del strong, li.done > strong { color: var(--accent); }
li.done::after { content: "DONE"; margin-left: 8px; font: 600 0.65rem var(--mono); letter-spacing: 0.08em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 3px; vertical-align: 2px; }
strong { font-weight: 600; }
code { font: 0.85em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand"><h1>4Stim Roadmap</h1><p>{{STAMP}}</p></div>
    <div class="meter"><div class="label"><span>Done</span><span>{{DONE}} / {{TOTAL}}</span></div><div class="track"><div class="fill"></div></div></div>
    <nav>{{NAV}}</nav>
  </aside>
  <main>{{BODY}}</main>
</div>
</body>
</html>
